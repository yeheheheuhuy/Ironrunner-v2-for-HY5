name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly (32-bit Windows target)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target i686-pc-windows-msvc

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/ironrunner.exe dist/
          Copy-Item target/i686-pc-windows-msvc/release/ironrunner.dll dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ironrunner-HY5
          path: dist/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
