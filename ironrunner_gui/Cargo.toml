cargo-features = ["different-binary-name"]

[package]
name = "ironrunner_gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ironrunner"
filename = "ironrunner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
dll-syringe = "0.17.1"
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
eframe = "0.33.3"
arc-swap = "1.8.0"
humantime = "2.3.0"
